# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
    - id: pylint
      name: pylint
      entry: python3 -m pylint
      language: system
      types: [python]
    - id: pytest
      name: pytest
      entry: python3 -m pytest
      language: system
      pass_filenames: false
      always_run: true
